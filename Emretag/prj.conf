CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_DK_LIBRARY=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="EmreTag"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_BONDABLE=n

# The Ranging Profile recommends a MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# This reduces RAM usage. Additional RAM is needed to support optional
# features such as mode 3 or multiantenna. Change or remove these if
# using those features
CONFIG_BT_RAS_MODE_3_SUPPORTED=n
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CS_DE_MAX_NUM_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=1
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=n
CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y

# Disabling the CS Test command reduces flash usage
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n

# This allows CS and ACL to use different PHYs
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# Let the initiating device control the PHY updates
CONFIG_BT_AUTO_PHY_UPDATE=n

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_RAS=y
CONFIG_BT_RAS_RRSP=y

# IMU. The onboard LSM6DS3TR-C is driven by the LSM6DSL driver (see the
# "st,lsm6dsl" compatible in the board DTS). The driver selects I2C itself.
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
# Poll the sensor instead of using its INT pin.
CONFIG_LSM6DSL_TRIGGER_NONE=y
# The driver defaults are 0 ("selected at runtime"), which leaves the sensor
# powered down and every reading at zero. 4 = 104 Hz.
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_ACCEL_FS=2
CONFIG_LSM6DSL_GYRO_ODR=4
CONFIG_LSM6DSL_GYRO_FS=250

# Required for the %f conversions in the IMU log output.
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Firmware update over BLE (SMP / MCUmgr): currently disabled ---
#
# Belongs together with the MCUboot block in sysbuild.conf - image upload is
# pointless without a bootloader to hand the new image to. Re-enable both.
#
# CONFIG_MCUMGR=y
# CONFIG_MCUMGR_TRANSPORT_BT=y
#
# With CONFIG_BT_SMP the SMP service defaults to requiring an encrypted and
# authenticated link, which this application cannot provide because it does not
# bond (CONFIG_BT_BONDABLE=n). Left at the default, every DFU attempt fails with
# an ATT authentication error - an hour lost to a symptom that never names its
# cause. Open access is acceptable on a bench device because MCUboot still
# refuses anything not signed with the right key; a shipping product should bond
# and put this back to RW_AUTHEN so the link is trusted too.
#
# CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
# CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
#
# CONFIG_MCUMGR_GRP_IMG=y
# CONFIG_MCUMGR_GRP_OS=y
# CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
#
# CONFIG_FLASH=y
# CONFIG_FLASH_MAP=y
# CONFIG_STREAM_FLASH=y
# CONFIG_IMG_MANAGER=y
# CONFIG_IMG_ERASE_PROGRESSIVELY=y
# CONFIG_MCUBOOT_IMG_MANAGER=y
