# --- Secure boot and DFU: currently disabled ---
#
# Re-enable together with the MCUmgr block in prj.conf; neither half is useful
# on its own. A pristine build is needed either way, because sysbuild only
# collects this file at configure time:
#
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp -p always
#
# MCUboot as an immutable first-stage bootloader:
#
# SB_CONFIG_BOOTLOADER_MCUBOOT=y
#
# ED25519 over SHA-256. The nRF54L15 has hardware support for it, and the
# signature is small compared with RSA.
#
# SB_CONFIG_BOOT_SIGNATURE_TYPE_ED25519=y
#
# Swap-using-move keeps the previous image in the other slot, which is what
# makes revert possible: an image that boots but is never confirmed is rolled
# back on the next reset. Overwrite-only would delete the old image and there
# would be nothing to fall back to.
#
# SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
#
# Without a key file the build falls back to the MCUboot sample key that ships
# with the SDK - which is public, so it authenticates nothing. Generate one and
# keep the .pem out of the repository:
#
#   imgtool keygen -k mcuboot_signing_key.pem -t ed25519
#
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="mcuboot_signing_key.pem"
